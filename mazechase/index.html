/* Lo-fi radio: a seamless loop played through Web Audio, faded in and out. Browsers only allow sound after a tap,
   so the button starts it; the choice is remembered and offered again ("resume") on the next page. */
(function(){var b=document.getElementById('radio'),lab=document.getElementById('radioL');if(!b)return;
var ctx,gain,src,buf,on=false,loading=false,KEY='kf-lofi';
function pref(v){try{if(v===undefined)return localStorage.getItem(KEY);localStorage.setItem(KEY,v)}catch(e){return null}}
if(pref()==='on')lab.textContent='resume lo-fi';
function ui(){b.setAttribute('aria-pressed',on?'true':'false');lab.textContent=on?'lo-fi on':'lo-fi radio'}
async function start(){if(loading)return;ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
 if(!buf){loading=true;lab.textContent='tuning in…';try{var r=await fetch('/assets/lofi.mp3');buf=await ctx.decodeAudioData(await r.arrayBuffer())}catch(e){loading=false;lab.textContent='radio off';return}loading=false}
 if(ctx.state==='suspended')await ctx.resume();
 gain=ctx.createGain();gain.gain.value=0;gain.connect(ctx.destination);src=ctx.createBufferSource();src.buffer=buf;src.loop=true;src.connect(gain);src.start();
 gain.gain.linearRampToValueAtTime(.55,ctx.currentTime+2.2);on=true;pref('on');ui()}
function stop(){if(!src)return;var s=src,g=gain;g.gain.cancelScheduledValues(ctx.currentTime);g.gain.setValueAtTime(g.gain.value,ctx.currentTime);g.gain.linearRampToValueAtTime(0,ctx.currentTime+.9);setTimeout(function(){try{s.stop()}catch(e){}},950);src=null;on=false;pref('off');ui()}
